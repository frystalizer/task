<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Scheduler</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="header">
      <span>📅 Task Scheduler</span>
    </div>

    <!-- Upcoming / Current Tasks Section -->
    <div class="section">
      <div class="label">Due Tasks</div>
      <div id="upcoming-tasks-list" class="task-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Calendar Section -->
    <div class="calendar-container">
      <div class="calendar-header">
        <button id="prev-month" class="nav-btn">&lt;</button>
        <div id="calendar-title" class="calendar-title">Month Year</div>
        <button id="next-month" class="nav-btn">&gt;</button>
      </div>
      <div id="calendar-grid" class="calendar-grid">
        <!-- Calendar slots rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Floating Add Task Button -->
  <button id="open-modal-btn" class="fab-btn">+ Add Task</button>

  <!-- Add/Edit Task Popup Modal -->
  <div id="task-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">New Task</h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>
      
      <div class="modal-body">
        <input type="hidden" id="editing-task-id" value="" />

        <div class="form-group">
          <label class="form-label">Task Description</label>
          <input type="text" id="task-title-input" class="form-input" placeholder="e.g. Water plants, Change filter" />
        </div>

        <div class="form-group">
          <label class="form-label">Start Date</label>
          <input type="date" id="task-start-input" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label">Repeat Interval</label>
          <select id="task-interval-select" class="form-input form-select">
            <option value="0">Once (No repeat)</option>
            <option value="1">Daily</option>
            <option value="7" selected>Weekly</option>
            <option value="14">Bi-weekly (Every 2 weeks)</option>
            <option value="30">Monthly (Every 30 days)</option>
            <option value="60">Bi-monthly (Every 2 months)</option>
            <option value="90">Quarterly (Every 3 months)</option>
          </select>
        </div>

        <!-- Color Picker -->
        <div class="form-group">
          <label class="form-label">Task Color</label>
          <div class="color-picker-grid" id="color-picker">
            <div class="color-option selected" data-color="#f97316" style="background-color: #f97316;"></div>
            <div class="color-option" data-color="#3b82f6" style="background-color: #3b82f6;"></div>
            <div class="color-option" data-color="#10b981" style="background-color: #10b981;"></div>
            <div class="color-option" data-color="#a855f7" style="background-color: #a855f7;"></div>
            <div class="color-option" data-color="#ec4899" style="background-color: #ec4899;"></div>
            <div class="color-option" data-color="#eab308" style="background-color: #eab308;"></div>
          </div>
        </div>

        <div class="modal-actions">
          <button id="delete-task-btn" class="delete-btn" style="display: none;">Delete Task</button>
          <button id="add-task-btn" class="apply-btn">Save Task</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden">
    <div class="toast-message" id="toast-title">Task Updated</div>
    <div class="toast-sub" id="toast-sub">Done for today!</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
