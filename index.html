<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Scheduler</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Scheduler</h1>
      <p>Track recurring habits & scheduled events</p>
      <button id="open-modal-btn">+ New Task</button>
    </header>

    <main>
      <section class="calendar-container">
        <div class="calendar-controls">
          <button id="prev-month">&lt;</button>
          <h2 id="calendar-title"></h2>
          <button id="next-month">&gt;</button>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>

      <section class="upcoming-container">
        <h2>Tasks</h2>
        <div id="upcoming-tasks-list" class="upcoming-list"></div>
      </section>
    </main>
  </div>

  <!-- Modal -->
  <div id="task-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">New Task</h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <input type="hidden" id="editing-task-id" value="" />

      <label for="task-title-input">Task Title</label>
      <input type="text" id="task-title-input" placeholder="e.g., Water Plants" />

      <label for="task-start-input">Start Date</label>
      <input type="date" id="task-start-input" />

      <label for="task-interval-select">Frequency</label>
      <select id="task-interval-select">
        <option value="0">Once</option>
        <option value="1">Daily</option>
        <option value="7">Weekly</option>
        <option value="14">Bi-weekly</option>
        <option value="30">Monthly</option>
        <option value="60">Bi-monthly</option>
        <option value="90">Quarterly</option>
      </select>

      <label>Color Label</label>
      <div id="color-picker" class="color-picker">
        <div class="color-option selected" data-color="#f97316" style="background-color: #f97316;"></div>
        <div class="color-option" data-color="#3b82f6" style="background-color: #3b82f6;"></div>
        <div class="color-option" data-color="#8b5cf6" style="background-color: #8b5cf6;"></div>
        <div class="color-option" data-color="#ec4899" style="background-color: #ec4899;"></div>
        <div class="color-option" data-color="#14b8a6" style="background-color: #14b8a6;"></div>
      </div>

      <div class="modal-actions">
        <button id="delete-task-btn" class="btn-danger" style="display: none;">Delete</button>
        <button id="add-task-btn">Save Task</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden">
    <div id="toast-title"></div>
    <div id="toast-sub"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
