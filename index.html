<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Scheduler & Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-content">
        <h1>Task Scheduler</h1>
        <p class="subtitle">Track recurring habits & scheduled events</p>
      </div>
      <button id="open-modal-btn" class="btn btn-primary">+ New Task</button>
    </header>

    <!-- Main Grid Content -->
    <main class="main-content">
      <!-- Calendar View -->
      <section class="calendar-section">
        <div class="calendar-header">
          <button id="prev-month" class="icon-btn">&lt;</button>
          <h2 id="calendar-title">Month Year</h2>
          <button id="next-month" class="icon-btn">&gt;</button>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>

      <!-- Upcoming Tasks Sidebar -->
      <section class="upcoming-section">
        <h2>Tasks</h2>
        <div id="upcoming-tasks-list" class="tasks-list"></div>
      </section>
    </main>
  </div>

  <!-- Task Creation / Edit Modal -->
  <div id="task-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">New Task</h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>
      
      <div class="modal-body">
        <input type="hidden" id="editing-task-id" value="" />

        <div class="form-group">
          <label for="task-title-input">Task Title</label>
          <input 
            type="text" 
            id="task-title-input" 
            placeholder="e.g., Water Plants" 
            autocomplete="off" 
          />
        </div>

        <div class="form-group">
          <label for="task-start-input">Start Date</label>
          <input type="date" id="task-start-input" />
        </div>

        <div class="form-group">
          <label for="task-interval-select">Frequency</label>
          <select id="task-interval-select">
            <option value="0">Once (Non-recurring)</option>
            <option value="1">Daily</option>
            <option value="7">Weekly</option>
            <option value="14">Bi-weekly</option>
            <option value="30">Monthly</option>
            <option value="60">Bi-monthly</option>
            <option value="90">Quarterly</option>
          </select>
        </div>

        <div class="form-group">
          <label>Color Label</label>
          <div id="color-picker" class="color-picker">
            <span class="color-option selected" data-color="#f97316" style="background-color: #f97316;"></span>
            <span class="color-option" data-color="#3b82f6" style="background-color: #3b82f6;"></span>
            <span class="color-option" data-color="#8b5cf6" style="background-color: #8b5cf6;"></span>
            <span class="color-option" data-color="#ec4899" style="background-color: #ec4899;"></span>
            <span class="color-option" data-color="#14b8a6" style="background-color: #14b8a6;"></span>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="delete-task-btn" class="btn btn-danger" style="display: none;">Delete</button>
        <button id="add-task-btn" class="btn btn-primary">Save Task</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden">
    <div id="toast-title" class="toast-title"></div>
    <div id="toast-sub" class="toast-sub"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
